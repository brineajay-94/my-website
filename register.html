<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Ajay Kafle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/png" href="logo.png">
<style>
:root { --primary: #ff6b00; --secondary: #ff8c42; --dark: #222; --light: #fff; --bg: #fafafa; --shadow: 0 10px 30px rgba(0,0,0,0.08); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.auth-wrap { width: 100%; max-width: 440px; padding: 20px; }
.auth-box { background: var(--light); border-radius: 20px; box-shadow: var(--shadow); padding: 40px 32px; }
.auth-box .logo { text-align: center; margin-bottom: 28px; }
.auth-box .logo img { width: 56px; height: 56px; border-radius: 50%; }
.auth-box .logo h1 { font-family: 'Caveat', cursive; color: var(--primary); font-size: 1.8rem; margin-top: 8px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 0.85rem; }
.form-group label .required { color: #e74c3c; }
.form-group input { width: 100%; padding: 11px 14px; border: 2px solid #eee; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: 0.3s; }
.form-group input:focus { outline: none; border-color: var(--primary); }
.btn { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Poppins', sans-serif; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,107,0,0.25); }
.auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; }
.auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }
.error-msg { color: #e74c3c; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
.back-link { display: inline-block; margin-bottom: 20px; color: var(--dark); text-decoration: none; font-size: 0.9rem; }
.back-link i { margin-right: 5px; }
.back-link:hover { color: var(--primary); }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    <div class="logo">
      <img src="logo.png" alt="Logo">
      <h1>Create Account</h1>
    </div>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" required placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="password" required placeholder="Min 6 characters" minlength="6">
      </div>
      <div class="form-group">
        <label>Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirmPassword" required placeholder="Re-enter password">
      </div>
      <div class="form-group">
        <label>Contact Number <span class="required">*</span></label>
        <input type="tel" id="contactNumber" required placeholder="Enter your contact number">
      </div>
      <div id="errorMsg" class="error-msg"></div>
      <button type="submit" class="btn">Register</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
if (localStorage.getItem('userData')) { window.location.href = 'dashboard.html'; }
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fullName = document.getElementById('fullName').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const contactNumber = document.getElementById('contactNumber').value.trim();
  const errorEl = document.getElementById('errorMsg');

  if (!fullName || !email || !password || !confirmPassword || !contactNumber) {
    errorEl.textContent = 'All fields are required'; errorEl.style.display = 'block'; return;
  }
  if (password.length < 6) {
    errorEl.textContent = 'Password must be at least 6 characters'; errorEl.style.display = 'block'; return;
  }
  if (password !== confirmPassword) {
    errorEl.textContent = 'Passwords do not match'; errorEl.style.display = 'block'; return;
  }

  const result = await register(fullName, email, password, contactNumber);
  if (result.success) {
    errorEl.style.display = 'none';
    window.location.href = 'dashboard.html';
  } else {
    errorEl.textContent = result.error || 'Registration failed';
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
