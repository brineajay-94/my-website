<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ajay Kafle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" type="image/png" href="ajay.png">
<style>
:root { --primary: #ff6b00; --secondary: #ff8c42; --dark: #222; --light: #fff; --bg: #fafafa; --shadow: 0 10px 30px rgba(0,0,0,0.08); --modal-overlay: rgba(0,0,0,0.5); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.auth-wrap { width: 100%; max-width: 420px; padding: 20px; }
.auth-box { background: var(--light); border-radius: 20px; box-shadow: var(--shadow); padding: 40px 32px; }
.auth-box .logo { text-align: center; margin-bottom: 28px; }
.auth-box .logo img { width: 56px; height: 56px; border-radius: 50%; }
.auth-box .logo h1 { font-family: 'Caveat', cursive; color: var(--primary); font-size: 1.8rem; margin-top: 8px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.9rem; }
.form-group input { width: 100%; padding: 12px 14px; border: 2px solid #eee; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; transition: 0.3s; }
.form-group input:focus { outline: none; border-color: var(--primary); }
.btn { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Poppins', sans-serif; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,107,0,0.25); }
.auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; }
.auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }
.error-msg { color: #e74c3c; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
.back-link { display: inline-block; margin-bottom: 20px; color: var(--dark); text-decoration: none; font-size: 0.9rem; }
.back-link i { margin-right: 5px; }
.back-link:hover { color: var(--primary); }
.forgot-link { display: block; text-align: right; font-size: 0.85rem; margin-top: 6px; }
.forgot-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
.forgot-link a:hover { text-decoration: underline; }
.modal-overlay { display: none; position: fixed; inset: 0; background: var(--modal-overlay); z-index: 2000; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-box { background: var(--light); border-radius: 20px; padding: 36px 30px; max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); text-align: center; }
.modal-box h2 { font-size: 1.4rem; margin-bottom: 8px; }
.modal-box p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
.modal-box .form-group { margin-bottom: 0; }
.modal-box .btn { margin-top: 14px; }
.modal-close { position: absolute; top: 16px; right: 20px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #999; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    <div class="logo">
      <img src="ajay.png" alt="Logo">
      <h1>Welcome Back</h1>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
        <div class="forgot-link"><a href="#" onclick="showForgotModal();return false;">Forgot Password?</a></div>
      </div>
      <div id="errorMsg" class="error-msg"></div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>
</div>

<div class="modal-overlay" id="forgotModal">
  <div class="modal-box" style="position:relative;">
    <button class="modal-close" onclick="closeForgotModal()">&times;</button>
    <h2>Reset Password</h2>
    <p>Enter your email and we'll send you a link to reset your password.</p>
    <form id="forgotForm">
      <div class="form-group">
        <input type="email" id="resetEmail" required placeholder="Your email address">
      </div>
      <div id="forgotError" class="error-msg" style="margin-bottom:10px;"></div>
      <button type="submit" class="btn" id="resetBtn">Send Reset Link</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
if (localStorage.getItem('userData')) { window.location.href = 'dashboard.html'; }

function showForgotModal() { document.getElementById('forgotModal').classList.add('show'); }
function closeForgotModal() { document.getElementById('forgotModal').classList.remove('show'); document.getElementById('forgotError').style.display = 'none'; }
document.getElementById('forgotModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeForgotModal(); });
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value.trim();
  const errorEl = document.getElementById('forgotError');
  const btn = document.getElementById('resetBtn');
  if (!email) { errorEl.textContent = 'Please enter your email'; errorEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    errorEl.style.color = '#27ae60'; errorEl.textContent = 'Reset link sent! Check your inbox.'; errorEl.style.display = 'block';
    btn.textContent = 'Sent';
    setTimeout(closeForgotModal, 2500);
  } catch (err) {
    errorEl.style.color = '#e74c3c'; errorEl.textContent = err.message; errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Send Reset Link';
  }
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('errorMsg');

  if (!email || !password) { errorEl.textContent = 'All fields are required'; errorEl.style.display = 'block'; return; }

  const result = await login(email, password);
  if (result.success) {
    errorEl.style.display = 'none';
    if (result.user.role === 'admin') {
      window.location.href = 'admin/index.html';
    } else {
      window.location.href = 'dashboard.html';
    }
  } else {
    errorEl.textContent = result.error || 'Login failed';
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
